name: Shell tests

on:
  pull_request:
  push:
    branches:
      - 'main'
      - 'kickstarter/base'
      - 'kickstarter/stretch-1'

permissions:
  contents: read

jobs:
  shelltests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      with:
        path: 'rebar'
    - name: Setup Erlang and Elixir
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124  # v1.24.1
      with:
          otp-version: '29'
          elixir-version: '1.20.4'
    - name: Compile
      run: ./bootstrap
      working-directory: ./rebar
    - name: Install Rebar
      run: |
        sudo cp ./rebar/rebar /usr/local/bin/

    - name: Checkout Shell Tests
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      with:
          repository: 'stritzinger/rebar3_tests'
          path: 'rebar3_tests'

    - name: Install shelltestrunner
      run: |
        sudo apt-get update
        sudo apt-get install -y shelltestrunner build-essential cmake liblz4-dev

    - name: Run Shell Tests
      run: |
        mix local.hex --force
        ./run_tests.sh
      working-directory: ./rebar3_tests
