name: Shell tests

on:
  pull_request:
  push:
    branches:
      - 'main'
      - 'kickstarter/base'

jobs:
  shelltests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - uses: erlef/setup-beam@v1
      with:
          otp-version: '28.0'
          elixir-version: '1.19.5'
    - name: Compile
      run: ./bootstrap
    - name: Install
      run: |
        sudo cp ./rebar /usr/local/bin/

    - name: Checkout shell tests
      run: git clone https://github.com/stritzinger/rebar3_tests

    - name: Install and run shelltestrunner
      run: |
        sudo apt-get update
        sudo apt-get install -y shelltestrunner build-essential cmake liblz4-dev
        cd rebar3_tests
        mix local.hex --force
        ./run_tests.sh
